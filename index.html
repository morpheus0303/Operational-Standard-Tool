<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Barnes Check">
<meta name="theme-color" content="#001F2F">
<title>Barnes Field Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column, phone-first. Gate -> home (categories) -> category cards; tracker by exhibit and date. Tennis Social brand, dark by design. */
:root{
  --bg:#001F2F; --card:#07293B; --card2:#0B3346; --line:#1B4457; --text:#E4F7F1; --mute:#81B0B8;
  --aqua:#66CBBA; --teal:#00B1B4; --red:#ED4246; --amber:#E8B04B; --grey:#5E7F8A; --ink:#001F2F;
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
body{font:400 16px/1.5 var(--body);padding-inline:16px;padding-block:0 64px}
.w{max-width:760px;margin:0 auto;display:grid;gap:18px}
.w>*{min-width:0}
header.top{padding-top:20px;display:grid;gap:6px}
.eb{font:600 11px/1.3 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
h1{font:700 30px/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 21px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 15px/1.3 var(--display);margin:0;color:var(--mute);letter-spacing:.04em}
p{margin:0}
.muted{color:var(--mute)} .small{font-size:13px}
.banner{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font-size:14px}
.banner.warn{border-color:var(--amber)} .banner.ok{border-color:var(--aqua)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.btn{min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:600}
.btn.primary{background:var(--aqua);color:var(--ink);border-color:var(--aqua)}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.row2 .btn{flex:1 1 200px}
.bar{height:8px;border-radius:4px;background:var(--card2);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.s-pass{background:var(--aqua)} .s-partial{background:var(--amber)} .s-fail{background:var(--red)} .s-cant{background:var(--teal)} .s-na{background:var(--grey)}
.cats{display:grid;gap:10px}
.cat{display:grid;gap:8px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:44px}
.cat .r{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cat b{font:600 17px/1.25 var(--display)}
.cnt{font:500 13px var(--mono);color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.flag{font-size:13px;color:var(--red)}
.box{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.in{display:flex;gap:8px}
.in input{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.nav .t{font:600 16px/1.2 var(--display);flex:1;min-width:0}
.items{display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.item.child{margin-left:14px;border-left:3px solid var(--line)}
.hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.id{font:500 12px var(--mono);color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
.nm{font:600 17px/1.3 var(--display);flex:1 1 200px;min-width:0}
.tag{font:600 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:4px 6px}
.tag.crit{border:1px solid var(--red)} .tag.added{border:1px solid var(--line);color:var(--mute)}
.when{font:400 12.5px/1.45 var(--mono);color:var(--mute);border-left:2px solid var(--teal);padding-left:8px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.src{font-size:12.5px;color:var(--mute)} .src q{font-style:italic}
.st{display:flex;flex-wrap:wrap;gap:6px}
.st button{min-height:44px;flex:1 1 30%;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:14px;padding:8px 6px}
.st button[aria-pressed="true"].pass{background:var(--aqua);color:var(--ink);border-color:var(--aqua)}
.st button[aria-pressed="true"].partial{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.st button[aria-pressed="true"].fail{background:var(--red);color:#fff;border-color:var(--red)}
.st button[aria-pressed="true"].cant{background:var(--teal);color:var(--ink);border-color:var(--teal)}
.st button[aria-pressed="true"].na{background:var(--grey);color:#fff;border-color:var(--grey)}
.att{display:grid;gap:6px} .opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-height:44px;padding:8px 12px;border-radius:22px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.opts button[aria-pressed="true"]{border-color:var(--text);background:var(--card2);font-weight:600}
textarea{width:100%;min-height:72px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px;resize:vertical}
.media{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.media img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.media a{font-size:13px;color:var(--text);min-height:44px;display:inline-flex;align-items:center}
.stamp{font:400 12px var(--mono);color:var(--mute)}
.addmiss{background:var(--card);border:1px dashed var(--mute);border-radius:12px;padding:14px;display:grid;gap:10px}
.misslist{display:grid;gap:8px}
.miss{border-left:3px solid var(--amber);padding:6px 10px;background:var(--card);border-radius:6px;font-size:14px}
.saving{font:400 12px var(--mono);color:var(--mute)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{min-height:44px;padding:8px 12px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:13.5px}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:600}
.grp{display:grid;gap:8px}
.trow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.trow .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pill{font:600 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:5px 8px;white-space:nowrap;border:1px solid var(--line);color:var(--mute)}
.pill.pass{background:var(--aqua);color:var(--ink);border-color:var(--aqua)} .pill.partial{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.pill.fail{background:var(--red);color:#fff;border-color:var(--red)} .pill.cant{background:var(--teal);color:var(--ink);border-color:var(--teal)} .pill.na{background:var(--grey);color:#fff;border-color:var(--grey)}
.deps{display:flex;flex-wrap:wrap;gap:6px;font:400 12px var(--mono);color:var(--mute)}
.dep{border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.dep.bad{border-color:var(--red);color:var(--text)} .dep.ext{border-style:dashed}
.blocked{font-size:13px;color:var(--amber)}
.jump{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;text-underline-offset:3px;font-size:13px;min-height:44px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}

body{margin:0;padding-top:env(safe-area-inset-top,0px)}
.gate{max-width:420px;margin:12vh auto 0;display:grid;gap:14px}
.gate input{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px;width:100%}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:14px}
.chk input{width:22px;height:22px}
.sendbar{position:sticky;bottom:0;z-index:6;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:6px}
.unsent{font-size:13px;color:var(--amber)}
</style></head>
<body>
<div class="w" id="app">
  <header class="top">
    <p class="eb">Tennis Social · Mirror Factory work · Barnes</p>
    <h1>Barnes Field Checklist</h1>
    <p class="muted small" id="sub">Test each item on site. Mark what you see, write what happened, add a photo. Everything saves on this phone until you send it.</p>
  </header>
  <div id="status"></div>
  <div id="view"></div>
</div>

let DATA = null;
const STATUSES = [["pass","Pass"],["partial","Partial"],["fail","Fail"],["cant","Couldn't test"],["na","Not in scope"]];
const LABEL = Object.fromEntries(STATUSES);
const S = {results:{}, missing:[], build:null, name:"", view:"home", filter:"all", photos:[], urls:{}, lastSent:null, lastChange:null, deferred:false, busy:{}, msg:null};
let ALL, FIELD, BYID, byCat, CHECK_CATS;

/* ---------- tiny helpers ---------- */
function el(tag, attrs, kids){ const n = document.createElement(tag); if (attrs) for (const [k,v] of Object.entries(attrs)) {
  if (k === "text") n.textContent = v; else if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : v); }
  (kids||[]).forEach(k => k && n.appendChild(typeof k === "string" ? document.createTextNode(k) : k)); return n; }
function fmt(iso){ try { return new Date(iso).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); } catch(e){ return ""; } }
const b64u = { enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))), dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }

/* ---------- storage: IndexedDB on this phone ---------- */
const IDB = { db:null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open("barnes-field", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("kv"); d.createObjectStore("photos", {keyPath:"id"}); };
    r.onsuccess = () => { IDB.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(store, mode, fn){ return new Promise((res, rej) => { const t = IDB.db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error); }); },
  get(k){ return IDB.tx("kv","readonly", s => s.get(k)); }, set(k,v){ return IDB.tx("kv","readwrite", s => s.put(v,k)); },
  photos(){ return IDB.tx("photos","readonly", s => s.getAll()); }, addPhoto(p){ return IDB.tx("photos","readwrite", s => s.put(p)); },
  delPhoto(id){ return IDB.tx("photos","readwrite", s => s.delete(id)); } };
async function persist(bump){ if (bump !== false) S.lastChange = new Date().toISOString();
  await IDB.set("state", {results:S.results, missing:S.missing, build:S.build, name:S.name, lastChange:S.lastChange, lastSent:S.lastSent}); }

/* ---------- unlock ---------- */
async function deriveKey(pass, salt){ const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]); }
async function openWithKey(key){ const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64u.dec(LOCK.iv)}, key, b64u.dec(LOCK.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
function gate(err){ const v = document.getElementById("view"); v.textContent = ""; document.getElementById("sub").textContent = "Enter the passphrase Steven gave you.";
  const inp = el("input",{id:"pass",type:"password",autocomplete:"current-password",placeholder:"Passphrase","aria-label":"Passphrase"});
  const rem = el("input",{type:"checkbox",id:"rem",checked:true});
  const go = async () => { const b = document.getElementById("gobtn"); b.disabled = true; b.textContent = "Opening…";
    try { const key = await deriveKey(inp.value, b64u.dec(LOCK.salt)); DATA = await openWithKey(key);
      if (rem.checked) ls("bfc.k", b64u.enc(await crypto.subtle.exportKey("raw", key))); start(); }
    catch(e){ gate("That passphrase didn't work. Check it with Steven and try again."); } };
  v.appendChild(el("form",{class:"gate",onsubmit:e=>{e.preventDefault(); go();}},[
    el("label",{for:"pass",class:"eb",text:"Passphrase"}), inp,
    el("label",{class:"chk"},[rem, "Keep this phone unlocked"]),
    el("button",{class:"btn primary",id:"gobtn",type:"submit"},["Open checklist"]),
    err ? el("p",{class:"banner warn",text:err}) : null,
    location.hash === "#selftest" ? el("button",{class:"btn",type:"button",onclick:runSelfTest},["Run self-test (photos and packing)"]) : null ]));
  setTimeout(() => inp.focus(), 50); }

/* ---------- boot ---------- */
async function boot(){
  if (!LOCK) { document.getElementById("view").appendChild(el("p",{class:"banner warn",text:"This copy has no checklist in it yet. Steven makes the working copy with the lock tool."})); return; }
  const k = ls("bfc.k");
  if (k) { try { const key = await crypto.subtle.importKey("raw", b64u.dec(k), "AES-GCM", true, ["decrypt"]); DATA = await openWithKey(key); return start(); } catch(e){ ls("bfc.k", null); } }
  gate(); }
async function start(){
  ALL = DATA.items; FIELD = ALL.filter(i => i.field); BYID = Object.fromEntries(ALL.map(i => [i.id, i]));
  byCat = {}; DATA.categories.forEach(c => byCat[c.key] = FIELD.filter(i => i.cat === c.key)); CHECK_CATS = DATA.categories.filter(c => byCat[c.key].length);
  document.getElementById("sub").textContent = "Test each item on site. Mark what you see, write what happened, add a photo. Everything saves on this phone until you send it.";
  try { await IDB.open(); } catch(e){ S.msg = {ok:false, text:"This browser won't let the page save. Try Safari, and don't use a private window."}; }
  if (IDB.db) { const st = await IDB.get("state"); if (st) Object.assign(S, {results:st.results||{}, missing:st.missing||[], build:st.build||null, name:st.name||"", lastChange:st.lastChange||null, lastSent:st.lastSent||null});
    S.photos = await IDB.photos(); S.photos.forEach(p => S.urls[p.id] = URL.createObjectURL(p.blob)); }
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
  const v = ls("bfc.view"); if (v && (v === "home" || v === "tracker" || byCat[v])) S.view = v;
  if (location.hash === "#selftest") S.selftest = true;
  window.addEventListener("hashchange", () => { if (location.hash === "#selftest") { S.selftest = true; render(); } });
  render(); }

/* ---------- self-test (only with #selftest in the address): checks photo conversion and packing, stores nothing ---------- */
function canvasFile(type){ const c = document.createElement("canvas"); c.width = 2400; c.height = 1200; const g = c.getContext("2d");
  g.fillStyle = "#001F2F"; g.fillRect(0,0,2400,1200); g.fillStyle = "#66CBBA"; g.font = "160px sans-serif"; g.fillText("TS test " + type.split("/")[1], 120, 640);
  return new Promise(r => c.toBlob(b => r(new File([b], "test." + type.split("/")[1], {type})), type, 0.9)); }
async function heicSampleFile(){ const r = await fetch("test/sample-heic.b64.txt"); if (!r.ok) throw new Error("no HEIC sample on this site");
  const bin = atob((await r.text()).trim()); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new File([u], "sample.HEIC", {type:"image/heic"}); }
function showMsg(m){ if (DATA) { S.msg = m; render(); } else { const b = document.getElementById("status"); b.textContent = ""; b.appendChild(el("p",{class:"banner "+(m.ok?"ok":"warn"),text:m.text})); } }
async function runSelfTest(){ showMsg({ok:true, text:"Self-test running… (HEIC can take up to a minute)"}); const res = {};
  for (const [k, mk] of [["png", () => canvasFile("image/png")], ["jpg", () => canvasFile("image/jpeg")], ["heic", heicSampleFile]]) {
    const t0 = Date.now(); try { const f = await mk(); const p = await prepPhoto(f); const bmp = await createImageBitmap(p.blob);
      const b64 = await blobB64(p.blob); const back = JSON.parse(JSON.stringify({data:b64})).data.length === b64.length;
      res[k] = {ok: p.blob.type === "image/jpeg" && p.blob.size > 0 && back, out: bmp.width+"x"+bmp.height+" JPG, "+Math.round(p.blob.size/1024)+" KB", how:p.how, ms:Date.now()-t0}; }
    catch(e){ res[k] = {ok:false, error:(e && e.message) || "error", ms:Date.now()-t0}; } }
  const ok = Object.values(res).every(r => r.ok); S.selftestResult = res;
  showMsg({ok, text: "Self-test " + (ok ? "passed: " : "found problems: ") + Object.entries(res).map(([k,r]) => k.toUpperCase()+" "+(r.ok ? "ok ("+r.out+", "+r.how+")" : "failed ("+r.error+")")).join(" · ")});
  document.title = "SELFTEST " + (ok ? "PASS" : "FAIL"); }

/* ---------- views (same checklist and tracker as the Legal copy) ---------- */
const st = id => (S.results[id] && S.results[id].status) || null;
function go(v){ S.view = v; ls("bfc.view", v); render(); window.scrollTo(0,0); }
function tally(items){ const t = {pass:0,partial:0,fail:0,cant:0,na:0,none:0}; items.forEach(i => { t[st(i.id)||"none"]++; }); return t; }
function barFor(items){ const t = tally(items), n = items.length || 1; return el("div",{class:"bar","aria-hidden":"true"}, ["pass","partial","fail","cant","na"].map(k => { const i = el("i",{class:"s-"+k}); i.style.width = (100*t[k]/n)+"%"; return i; })); }
const unsent = () => S.lastChange && (!S.lastSent || S.lastChange > S.lastSent);

function renderHome(v){
  const t = tally(FIELD);
  if (S.selftest) v.appendChild(el("button",{class:"btn",onclick:runSelfTest},["Run self-test (photos and packing)"]));
  v.appendChild(el("div",{class:"box"},[
    el("label",{for:"who",class:"eb",text:"Your name (goes on everything you record)"}),
    el("div",{class:"in"},[ el("input",{id:"who",type:"text",placeholder:"e.g. Tyler",value:S.name||""}), el("button",{class:"btn",onclick:saveName},["Save"]) ]),
    el("label",{for:"build",class:"eb",text:"Build on the machines today (if shown on screen)"}),
    el("div",{class:"in"},[ el("input",{id:"build",type:"text",placeholder:"e.g. Barnes-rc3, Design preview02",value:(S.build&&S.build.text)||""}), el("button",{class:"btn",onclick:saveBuild},["Save"]) ]) ]));
  v.appendChild(el("div",{},[ el("p",{class:"small muted",text:`${FIELD.length - t.none} of ${FIELD.length} items checked · ${t.pass} pass · ${t.partial} partial · ${t.fail} fail · ${t.cant} couldn't test · ${S.photos.length} photos`}), barFor(FIELD) ]));
  const list = el("div",{class:"cats"});
  CHECK_CATS.forEach(c => { const items = byCat[c.key], tt = tally(items);
    list.appendChild(el("button",{class:"cat",onclick:()=>go(c.key)},[ el("div",{class:"r"},[ el("b",{text:c.name}), el("span",{class:"cnt",text:`${items.length-tt.none}/${items.length}`}) ]),
      barFor(items), tt.fail ? el("span",{class:"flag",text:`${tt.fail} fail`}) : null ])); });
  v.appendChild(list);
  v.appendChild(el("div",{class:"row2"},[ el("button",{class:"btn",onclick:()=>go("tracker")},["Tracker: by exhibit, date and dependency"]) ]));
  const m = S.missing.length; v.appendChild(el("p",{class:"small muted",text:`${m} thing${m===1?"":"s"} added as missing so far. Add more inside any category.`}));
  v.appendChild(el("details",{class:"box"},[ el("summary",{text:"How this saves, and how it gets to Steven"}),
    el("p",{class:"small",text:"Everything you tap, write and photograph saves on this phone straight away, even without signal."}),
    el("p",{class:"small",text:"Tap \"Send to Steven\" at the bottom whenever you want. It makes one file with everything so far and opens the share sheet, so you can AirDrop, text or email it. Send as often as you like; each file has everything up to that moment."}),
    el("p",{class:"small",text:"Use the page the same way every time (Home Screen icon or Safari, not both), because each keeps its own saved copy. Adding it to the Home Screen keeps your work safest."}),
    el("p",{class:"small muted",text:"Photos: JPG, PNG and iPhone HEIC all work, and the page keeps a smaller copy. Your originals stay in your camera roll. Videos: text them to Steven and write the time in the notes."}) ]));
}
function whenLine(it){ return el("p",{class:"when"},[`${it.exhibit} · ${it.window}`, el("br"), it.epic]); }
function itemCard(it){
  const r = S.results[it.id] || {};
  const card = el("article",{class:"item"+(it.parent && byCat[it.cat].some(p=>p.id===it.parent) ? " child":""),id:"it-"+it.id});
  card.appendChild(el("div",{class:"hd"},[ el("span",{class:"id",text:it.id}), el("span",{class:"nm",text:it.name}),
    it.critical ? el("span",{class:"tag crit",text:"Blocks play if it fails"}) : null, it.ts_added ? el("span",{class:"tag added",text:"Added for testing"}) : null ]));
  card.appendChild(whenLine(it));
  card.appendChild(el("ol",{class:"steps"}, it.steps.map(s => el("li",{text:s}))));
  const quoted = it.test && !it.test.startsWith("(");
  card.appendChild(el("p",{class:"src"},[ "Source: "+it.source, quoted ? el("br") : null, quoted ? el("q",{text:it.test}) : null ]));
  card.appendChild(el("div",{class:"st",role:"group","aria-label":"Result for "+it.id}, STATUSES.map(([k,lab]) =>
    el("button",{class:k,"aria-pressed":String(r.status===k),onclick:()=>setStatus(it,k)},[lab]))));
  if (r.status === "partial" || r.status === "fail") card.appendChild(el("div",{class:"att"},[ el("span",{class:"small muted",text:"What do you think caused it? (best guess is fine)"}),
      el("div",{class:"opts"}, DATA.attribution.map(a => el("button",{"aria-pressed":String(r.attribution===a),onclick:()=>saveResult(it,{attribution:a})},[a]))) ]));
  const ta = el("textarea",{"aria-label":"Notes for "+it.id,placeholder:"What happened? Time, what you did, what you saw.","data-id":it.id}); ta.value = r.note || "";
  let tmr; ta.addEventListener("input",()=>{ clearTimeout(tmr); tmr = setTimeout(()=>saveResult(it,{note:ta.value},true),800); });
  ta.addEventListener("blur",()=>{ clearTimeout(tmr); if ((S.results[it.id]||{}).note !== ta.value) saveResult(it,{note:ta.value}); else if (S.deferred) { S.deferred=false; render(); } });
  card.appendChild(ta);
  const media = el("div",{class:"media"});
  S.photos.filter(p => p.itemId === it.id).forEach(p => media.appendChild(el("a",{href:S.urls[p.id],target:"_blank",rel:"noopener"},[el("img",{src:S.urls[p.id],alt:"Photo for "+it.id})])));
  const fi = el("input",{type:"file",accept:"image/*,.heic,.heif",hidden:true,onchange:e=>addPhoto(it,e.target)});
  media.appendChild(fi); media.appendChild(el("button",{class:"btn",onclick:()=>fi.click()},[S.busy[it.id] ? "Saving photo…" : "Add photo"]));
  card.appendChild(media);
  if (r.photoNote) card.appendChild(el("p",{class:"banner warn",text:r.photoNote}));
  if (r.at) card.appendChild(el("p",{class:"stamp",text:`Set by ${r.by||"you"} · ${fmt(r.at)}`}));
  return card; }
function renderCat(v, key){
  const c = DATA.categories.find(x => x.key === key); const items = byCat[key];
  v.appendChild(el("div",{class:"nav"},[ el("button",{class:"btn",onclick:()=>go("home")},["← All"]), el("span",{class:"t",text:c.name}) ]));
  v.appendChild(barFor(items)); const box = el("div",{class:"items"}); items.forEach(it => box.appendChild(itemCard(it))); v.appendChild(box);
  const ta = el("textarea",{"aria-label":"Something missing",placeholder:"Something that should work here and doesn't, or isn't on this list.",id:"miss-"+key});
  v.appendChild(el("section",{class:"addmiss"},[ el("h2",{text:"Add something missing"}), ta, el("button",{class:"btn primary",onclick:()=>addMissing(key,ta)},["Add to the list"]) ]));
  const mine = S.missing.filter(m => m.cat === key);
  if (mine.length) v.appendChild(el("div",{class:"misslist"}, mine.map(m => el("div",{class:"miss"},[ el("p",{text:m.text}), el("p",{class:"stamp",text:`Added by ${m.by||"you"} · ${fmt(m.at)}`}) ])))); }
const EX_NAME = {"SOW":"Original SOW (Mar 2, 2026)","Exh A":"Exhibit A","Exh A → Exh C §3.5(b)":"Operational Standard: Exhibit A, carried by Exhibit C §3.5(b)","Exh B":"Exhibit B · Phase 2 (Apr 8, 2026)","Exh B → Exh E":"Exhibit B, still open in Exhibit E","CO-001":"Change Order CO-001 (eff. Jun 1, 2026)","CO-001 / Exh D → Exh E":"CO-001, worked on in Exhibits D and E","Exh C → D, E":"Exhibit C terms, every Period (D and E)","Exh D":"Exhibit D · Aug 16–Sep 16, 2026","Exh D → Exh E":"Exhibit D into Exhibit E","Exh E":"Exhibit E · Sep 17–Oct 16, 2026","GDD (MF target)":"MF's own design targets (GDD)"};
const EX_ORDER = Object.keys(EX_NAME);
function blockers(it){ return it.depends.filter(d => !d.startsWith("[") && (st(d)==="fail"||st(d)==="partial")); }
function renderTracker(v){
  v.appendChild(el("div",{class:"nav"},[ el("button",{class:"btn",onclick:()=>go("home")},["← All"]), el("span",{class:"t",text:"Tracker"}) ]));
  v.appendChild(el("p",{class:"small muted",text:"Every item, grouped by the exhibit it falls under, with its date or sprint, Mirror Factory's own epic or story, and what it depends on. A red dependency has failed or partly failed."}));
  const F = [["all","All"],["fail","Fail or partial"],["blocked","Blocked by a dependency"],["open","Not yet checked"]];
  v.appendChild(el("div",{class:"filters"}, F.map(([k,lab]) => el("button",{"aria-pressed":String(S.filter===k),onclick:()=>{S.filter=k;render();}},[lab]))));
  const keep = it => S.filter==="all" || (S.filter==="fail" && (st(it.id)==="fail"||st(it.id)==="partial")) || (S.filter==="blocked" && blockers(it).length) || (S.filter==="open" && !st(it.id));
  const groups = {}; ALL.filter(keep).forEach(it => (groups[it.exhibit] = groups[it.exhibit] || []).push(it));
  const keys = Object.keys(groups).sort((a,b) => (EX_ORDER.indexOf(a)+1||99) - (EX_ORDER.indexOf(b)+1||99));
  if (!keys.length) v.appendChild(el("p",{class:"banner",text:"Nothing matches this filter yet."}));
  keys.forEach(k => { const its = groups[k]; const g = el("section",{class:"grp"},[ el("h2",{text:EX_NAME[k]||k}), barFor(its) ]);
    its.forEach(it => { const s = st(it.id), b = blockers(it);
      g.appendChild(el("div",{class:"trow"},[ el("div",{class:"top"},[ el("span",{class:"id",text:it.id}), el("span",{class:"nm",text:it.name}), el("span",{class:"pill "+(s||""),text:s?LABEL[s]:(it.field?"Not checked":it.basis)}) ]),
        el("p",{class:"when"},[it.window, el("br"), it.epic]),
        it.depends.length ? el("div",{class:"deps"},[ "Depends on:", ...it.depends.map(d => { const ext = d.startsWith("["), ds = ext ? null : st(d);
          return el("span",{class:"dep"+((ds==="fail"||ds==="partial")?" bad":"")+(ext?" ext":""),text: ext ? d.slice(1,-1) : d+" "+(ds?LABEL[ds]:"untested")}); }) ]) : null,
        b.length ? el("p",{class:"blocked",text:`Waiting on ${b.join(", ")}, which ${b.length>1?"have":"has"} failed or partly failed.`}) : null,
        it.field && byCat[it.cat] && byCat[it.cat].length ? el("button",{class:"jump",onclick:()=>{ go(it.cat); setTimeout(()=>{ const n=document.getElementById("it-"+it.id); if(n) n.scrollIntoView(); },50); }},["Open in checklist"]) : null ])); });
    v.appendChild(g); }); }
function sendBar(){ const bar = el("div",{class:"sendbar"},[
    unsent() ? el("p",{class:"unsent",text:"You have results that haven't been sent yet."}) : (S.lastSent ? el("p",{class:"stamp",text:"Last sent "+fmt(S.lastSent)}) : null),
    el("div",{class:"row2"},[ el("button",{class:"btn primary",onclick:()=>send(true)},["Send to Steven"]), el("button",{class:"btn",onclick:()=>send(false)},["Send without photos"]) ]) ]);
  if (S.msg) bar.appendChild(el("p",{class:"banner "+(S.msg.ok?"ok":"warn"),text:S.msg.text})); return bar; }
function render(){
  const a = document.activeElement; if (a && a.tagName === "TEXTAREA" && a.dataset.id) { S.deferred = true; return; }
  const v = document.getElementById("view"); v.textContent = "";
  if (S.view === "home") renderHome(v); else if (S.view === "tracker") renderTracker(v); else renderCat(v, S.view);
  v.appendChild(sendBar()); }

/* ---------- saving on the phone ---------- */
async function saveResult(it, patch, quiet){ const body = Object.assign({}, S.results[it.id]||{}, patch, {itemId:it.id, by:S.name||"", at:new Date().toISOString()});
  if ("status" in patch && patch.status !== "partial" && patch.status !== "fail") delete body.attribution;
  S.results[it.id] = body; try { await persist(); } catch(e){ S.msg = {ok:false, text:"Couldn't save on this phone. Send what you have to Steven now."}; } if (!quiet) render(); }
function setStatus(it, k){ saveResult(it, {status: st(it.id) === k ? null : k}); }
async function saveName(){ S.name = document.getElementById("who").value.trim(); await persist(); render(); }
async function saveBuild(){ S.build = {text:document.getElementById("build").value.trim(), by:S.name||"", at:new Date().toISOString()}; await persist(); render(); }
async function addMissing(cat, ta){ const text = ta.value.trim(); if (!text) return; S.missing.push({cat, text:text.slice(0,4000), by:S.name||"", at:new Date().toISOString()}); ta.value = ""; await persist(); render(); }

/* ---------- photos: HEIC -> JPG, everything kept at up to 2000 px ---------- */
const isHeic = f => /image\/hei[cf]/i.test(f.type||"") || /\.(heic|heif)$/i.test(f.name||"");
let heicLib = null;
function loadHeicLib(){ if (heicLib) return heicLib; heicLib = new Promise((res, rej) => { const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"; s.onload = () => window.heic2any ? res(window.heic2any) : rej(new Error("converter missing")); s.onerror = () => rej(new Error("converter didn't load")); document.head.appendChild(s); });
  return heicLib; }
async function toBitmap(blob){ try { return await createImageBitmap(blob); } catch(e){ return null; } }
async function shrink(bmp, max){ const s = Math.min(1, max / Math.max(bmp.width, bmp.height)); const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", 0.85)); }
async function prepPhoto(file){ let src = file, how = null;
  if (isHeic(file)) { let bmp = await toBitmap(file); if (bmp) { how = "HEIC→JPG (native)"; return {blob: await shrink(bmp, 2000), how}; }
    const h = await loadHeicLib(); const r = await h({blob:file, toType:"image/jpeg", quality:0.9}); src = Array.isArray(r) ? r[0] : r; how = "HEIC→JPG (heic2any)"; }
  const bmp = await toBitmap(src); if (!bmp) throw new Error("not an image");
  return {blob: await shrink(bmp, 2000), how: how || ((bmp.width > 2000 || bmp.height > 2000) ? "resized to 2000 px" : "re-saved as JPG")}; }
async function addPhoto(it, input){ const f = input.files && input.files[0]; input.value = ""; if (!f) return;
  S.busy[it.id] = true; render();
  try { const p = await prepPhoto(f); const rec = {id: Date.now()+"-"+Math.random().toString(36).slice(2,8), itemId:it.id, blob:p.blob, type:"image/jpeg", name:(f.name||"photo").slice(0,120), takenAt: f.lastModified ? new Date(f.lastModified).toISOString() : null, at:new Date().toISOString(), by:S.name||"", how:p.how, origType:f.type||"", origSize:f.size};
    await IDB.addPhoto(rec); S.photos.push(rec); S.urls[rec.id] = URL.createObjectURL(rec.blob); await saveResult(it, {photoNote:null}, true); }
  catch(e){ S.results[it.id] = Object.assign({}, S.results[it.id]||{}, {photoNote:"That photo couldn't be saved here. Text it to Steven and write the time in the notes."}); }
  delete S.busy[it.id]; render(); }

/* ---------- send: one file, iPhone share sheet ---------- */
function blobB64(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
async function send(withPhotos){
  S.msg = {ok:true, text:"Packing your results…"}; render();
  const now = new Date(), exp = {format:"ts-barnes-field-export", version:1, exportedAt:now.toISOString(), by:S.name||"", build:S.build, itemsGenerated:DATA.generated,
    results:S.results, missing:S.missing, photoCount:S.photos.length, photos:[]};
  if (withPhotos) for (const p of S.photos) exp.photos.push({id:p.id, itemId:p.itemId, name:p.name, type:p.type, takenAt:p.takenAt, at:p.at, by:p.by, how:p.how, origType:p.origType, origSize:p.origSize, data: await blobB64(p.blob)});
  const stamp = now.toISOString().slice(0,16).replace(/[-:T]/g, "").replace(/^(\d{8})(\d{4})$/, "$1-$2");
  const file = new File([JSON.stringify(exp)], `barnes-field-results_${stamp}${withPhotos?"":"_no-photos"}.json`, {type:"application/json"});
  const mb = (file.size/1048576).toFixed(1);
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Barnes field results"}); }
    else { const a = el("a",{href:URL.createObjectURL(file),download:file.name}); document.body.appendChild(a); a.click(); a.remove(); }
    S.lastSent = new Date().toISOString(); await persist(false);
    S.msg = {ok:true, text:`Sent ${file.name} (${mb} MB).${withPhotos && file.size > 20*1048576 ? " It's large, so AirDrop or Messages work better than email." : ""}`}; }
  catch(e){ S.msg = {ok:false, text: e && e.name === "AbortError" ? "Not sent. Tap Send again when you're ready." : "Couldn't open the share sheet. Try again, or use Send without photos."}; }
  render(); }

boot();
</script>
</body></html>
